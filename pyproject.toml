[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ht_regression"
version = "0.1.0"
description = "Heavy-tailed regression for robot learning"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
download = ["huggingface-hub>=0.23.4"]
robomimic-data = ["numpy>=1.23.5", "h5py>=3.8", "scipy>=1.10"]
robomimic-sim = ["robomimic==0.2.0", "robosuite==1.2.0", "free-mujoco-py==2.1.6", "gym==0.23.1", "numba==0.56.4", "Cython==0.29.32", "patchelf==0.17.2.4"]
diffusion = ["diffusers==0.11.1", "huggingface-hub>=0.10,<0.26", "omegaconf>=2.3,<3", "dill>=0.3.5"]
evaluation = ["numpy>=1.23.5", "h5py>=3.8", "scipy>=1.10", "imageio>=2.31", "imageio-ffmpeg>=0.4.9"]
training = ["torch>=2.3", "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<3", "numpy>=1.23.5", "h5py>=3.8", "scipy>=1.10", "tensorboard>=2.9,<3"]
vision = ["torchvision>=0.16"]

[tool.uv]
# Reproduce the Linux/Python 3.10 Robomimic training dependencies.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'"]
# The legacy fork pins numba <=0.53, which predates Python 3.10.
# Praxis uses 0.56.4 with the same simulator source.
override-dependencies = ["numba==0.56.4"]
constraint-dependencies = [
    "dill==0.3.8",
    "h5py==3.15.1",
    "huggingface-hub==0.25.2",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "numpy==1.23.5",
    "omegaconf==2.3.0",
    "packaging==24.0",
    "pillow==9.5.0",
    # TensorBoard 2.9 without the training container's pure-Python protobuf override.
    "protobuf==3.20.3",
    "scipy==1.15.3",
    "setuptools==59.6.0",
    "tensorboard==2.9.0",
    # Public CUDA 12.4 wheels replace the NVIDIA 24.05 development builds.
    "torch==2.4.0+cu124",
    "torchvision==0.19.0+cu124",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
robosuite = { path = ".deps/robosuite", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools]
license-files = [
    "LICENSE",
    "ht_regression/policies/LICENSE.*",
    "ht_regression/policies/gr00t/LICENSE.*",
    "ht_regression/policies/pi05/LICENSE.*",
    "ht_regression/data/robomimic/LICENSE.*",
]

[tool.setuptools.packages.find]
include = ["ht_regression*"]

[tool.setuptools.package-data]
ht_regression = ["**/LICENSE.*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
