# @package _global_
defaults:
- /experiment/robomimic/_base/vision/ht_transformer
- _self_
name: lift_ph_visual_ht_transformer_2d_500ep_s41
dataloader:
  train:
    batch_size: 64
    num_workers: 4
    persistent_workers: true
  validation:
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 2
seed: 41
dataset:
  source_action_space: abs
  normalization: minmax
  obs_keys:
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
objective:
  nu: 200  # 2d: horizon 10 x action dimension 10.
training:
  device: cuda:0
  allow_tf32: true
  evaluation_seed: ${seed}
  compile:
    enabled: false
  scheduler:
    total_steps: 511000  # Preserve the original 3500-epoch cosine schedule.
  trainer:
    max_steps: 73000  # Stop at 500 epochs.
    log_every: 10
    validate_every: 146
    eval_every: 7300
    checkpoint_every: 7300
evaluation:
  source_robosuite_version: 1.2.0
  test_start_seed: 100000
  n_train: 6
  n_test: 50
  n_envs: 28
  num_workers: 8
  n_train_vis: 2
  n_test_vis: 4
  max_steps: 400
  render_hw:
  - 84
  - 84
